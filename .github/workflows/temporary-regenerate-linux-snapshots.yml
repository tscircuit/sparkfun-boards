name: Temporary regenerate Linux snapshots

on:
  push:
    branches: [bump]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: Regenerate reported PCB snapshots
        shell: bash
        run: |
          boards=(
            SparkFun-DeadOn-RTC-Breakout-DS3234
            SparkFun-Fuse-Breakout-Board
            SparkFun-Human-Presence-and-Motion-Sensor-STHS34PF80-Qwiic
            SparkFun-Level-Shifter-8-Channel-TXS0108E
            SparkFun-Line-Sensor-Breakout-QRE1113-Digital
            SparkFun-Qwiic-Adapter
            SparkFun-Qwiic-Shield-For-Thing-Plus
            SparkFun-Qwiic-Shim-for-Raspberry-Pi
            SparkFun-RGB-and-Gesture-Sensor
            SparkFun-SSOP-to-DIP-Adapter-28-Pin
            SparkFun-Triple-Axis-Accelerometer-Breakout-ADXL345
          )

          for board in "${boards[@]}"; do
            bunx tsci snapshot --update --pcb-only "boards/$board"
          done
      - name: Commit regenerated snapshots
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No snapshot changes generated"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'boards/*/__snapshots__/*.circuit-pcb.snap.svg'
          git commit -m "Update Linux PCB snapshots"
          git push origin HEAD:bump
